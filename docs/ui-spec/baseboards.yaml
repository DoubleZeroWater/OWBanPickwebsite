schemaVersion: 1
kind: ui-baseboards

globalRegions:
  matchHeader:
    content:
      - 队伍1名称与系列赛得分
      - 比赛名称与赛制
      - 当前入口身份
      - 队伍2名称与系列赛得分
  mapStack:
    content:
      - 当前赛制应显示的地图槽位
      - 已确认地图、比分、禁用英雄和阵容摘要
  presenceBar:
    content:
      - 队伍1连接状态
      - 管理员连接状态
      - 队伍2连接状态
  notificationStack:
    position: top-right
    maxStoredEvents: 100
    defaultDurationSource: global-admin.notificationDurationSeconds

baseboards:
  preparing-draft:
    lifecycle: preparing
    phase: configuring
    matchHeader: visible
    phaseLabel: 待配置阶段
    mapStack:
      state: empty-slots
      mapVisibility:
        ft2: 3
        ft3: 5
        ft4: 7
    presenceBar:
      state: visible-with-ready
    finalResult: hidden

  preparing-ready:
    lifecycle: preparing
    phase: waiting_ready
    matchHeader: visible
    phaseLabel: 确认配置阶段
    mapStack:
      state: empty-slots
    presenceBar:
      state: visible-with-ready
    finalResult: hidden

  running-current-map-pending:
    lifecycle: running
    phase:
      - pre_start_rest
      - interactive_random
      - map_pick
    matchHeader: visible
    phaseLabel: 比赛进行阶段
    mapStack:
      state: current-map-pending
      rules:
        - 已完成地图展示比分、禁用和确认信息
        - 当前未选择地图使用待定状态
        - 未到达地图保持空槽位
    presenceBar:
      state: visible-without-ready
    finalResult: hidden

  running-current-map-selected:
    lifecycle: running
    phase:
      - side_pick
      - lineup_pick
      - ban_order
      - ban_first
      - ban_second
      - score_entry
    matchHeader: visible
    phaseLabel: 比赛进行阶段
    mapStack:
      state: current-map-selected
      rules:
        - 当前地图显示模式、中文地图名和地图图片
        - 地图卡片不额外堆叠攻防或阵营文字
        - 确认后的禁用英雄显示在对应队伍一侧
        - 阵容在双方确认后才成为共享事实
    presenceBar:
      state: visible-without-ready
    finalResult: hidden

  running-map-completed:
    lifecycle: running
    phase: post_map_rest
    matchHeader: visible
    phaseLabel: 比赛进行阶段
    mapStack:
      state: latest-map-completed
      rules:
        - 最新地图显示双方比分
        - 非平局胜方增加系列赛得分
        - 平局不增加系列赛得分
        - 系列赛未结束时按规则展示下一地图槽位
    presenceBar:
      state: visible-without-ready
    finalResult: hidden

  completed:
    lifecycle: completed
    phase: completed
    matchHeader: visible
    phaseLabel: 比赛已结束
    mapStack:
      state: final-results
      rules:
        - 保留所有已完成地图结果
        - 不再创建额外地图步骤
    presenceBar:
      state: visible-without-ready
    bottomCenterStatus:
      state: visible
      text: 比赛已结束
    finalResult:
      state: hidden
      reason: 不增加独立持久终态页面；系列赛比分和地图结果继续由比赛底板原有区域展示

responsiveMapVisibility:
  ft2:
    initial: 3
    maximumWithTwoDraws: 5
  ft3:
    initial: 5
    maximumWithTwoDraws: 7
  ft4:
    initial: 7
    maximumWithTwoDraws: 9
  revealRule: >
    默认最后一张地图完成且仍未决出系列赛胜负时，先显示下一张；
    若该附加地图尚未完成，再预先显示最后一张备用地图。
