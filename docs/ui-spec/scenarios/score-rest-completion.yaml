schemaVersion: 1
kind: ui-scenarios
domain: score-rest-completion

scenarios:
  - id: SCORE_ADMIN_ONLY_EMPTY
    title: 管理员填写比分模式
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#比分设置与暂停
      - frontend/src/main.ts:3204
    given:
      fixture: score-entry
      config:
        scoreReportMode: admin_only
    expect:
      baseboard: running-current-map-selected
      views:
        team_left:
          foreground: score-selector
          mode: readonly
          headline: 等待管理员填写比分
          visibleData:
            - 本图地图
            - 双方攻防或阵营
            - 双方禁用英雄
            - 双方已确认阵容
          controls:
            edit-score:
              state: disabled
              reason: 当前配置为管理员填写比分
            confirm-score:
              state: disabled
              label: 等待管理员填写
            toggle-own-team-pause:
              state: enabled
        team_right:
          foreground: score-selector
          mode: readonly
          headline: 等待管理员填写比分
          visibleData:
            - 本图比赛信息
          controls:
            edit-score:
              state: disabled
              reason: 当前配置为管理员填写比分
            confirm-score:
              state: disabled
              label: 等待管理员填写
            toggle-own-team-pause:
              state: enabled
        admin:
          foreground: score-selector
          mode: acting-for-team
          actingAs: both
          headline: 填写比分
          visibleData:
            - 本图比赛信息
          controls:
            edit-score:
              state: enabled
            confirm-score:
              state: disabled
              reason: 双方比分尚未完整
            toggle-left-team-pause:
              state: enabled
            toggle-right-team-pause:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          visibleData:
            - 底板上已确认的本图信息
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []

  - id: SCORE_TEAM_MODE_EMPTY
    title: 任一队可以提交比分
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#比分设置与暂停
      - frontend/src/main.ts:6752
    given:
      fixture: score-entry
      config:
        scoreReportMode: team_submit_opponent_confirm
    expect:
      baseboard: running-current-map-selected
      views:
        team_left:
          foreground: score-selector
          mode: interactive
          actingAs: left
          headline: 等待任一队伍提交比分
          controls:
            edit-score:
              state: enabled
            submit-score:
              state: disabled
              reason: 双方比分尚未完整
            reject-score:
              state: hidden
            toggle-own-team-pause:
              state: enabled
        team_right:
          foreground: score-selector
          mode: interactive
          actingAs: right
          headline: 等待任一队伍提交比分
          controls:
            edit-score:
              state: enabled
            submit-score:
              state: disabled
              reason: 双方比分尚未完整
            reject-score:
              state: hidden
            toggle-own-team-pause:
              state: enabled
        admin:
          foreground: score-selector
          mode: acting-for-team
          actingAs: both
          headline: 填写或确认比分
          controls:
            edit-score:
              state: enabled
            confirm-score:
              state: disabled
              reason: 双方比分尚未完整
            toggle-left-team-pause:
              state: enabled
            toggle-right-team-pause:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []

  - id: SCORE_LEFT_SUBMITTED
    title: 队伍1已提交比分，等待队伍2确认
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#比分设置与暂停
      - frontend/src/main.ts:7234
    given:
      fixture: score-entry
      config:
        scoreReportMode: team_submit_opponent_confirm
      runtime:
        remainingTimeMs: 120000
        scoreProposal:
          submittedBy: left
          score:
            left: 2
            right: 1
          rejectedBy: null
    expect:
      baseboard: running-current-map-selected
      views:
        team_left:
          foreground: score-selector
          mode: readonly
          actingAs: left
          headline: 等待队伍2确认
          visibleData:
            - 队伍1提交的双方比分
            - 比分确认倒计时
          controls:
            edit-score:
              state: disabled
              reason: 比分已经提交
            confirm-score:
              state: disabled
              label: 等待对方确认
            reject-score:
              state: hidden
            toggle-own-team-pause:
              state: disabled
              reason: 比分提交后不能开始或恢复队伍暂停
        team_right:
          foreground: score-selector
          mode: interactive
          actingAs: right
          headline: 队伍1已提交，等待队伍2确认
          visibleData:
            - 待确认比分
            - 比分确认倒计时
          controls:
            edit-score:
              state: disabled
              reason: 已进入对方比分确认
            confirm-score:
              state: enabled
              label: 确认对方比分
            reject-score:
              state: enabled
              label: 申诉错误比分
            toggle-own-team-pause:
              state: disabled
              reason: 比分提交后不能开始或恢复队伍暂停
        admin:
          foreground: score-selector
          mode: acting-for-team
          actingAs: both
          headline: 队伍1已提交，等待队伍2确认
          controls:
            edit-score:
              state: enabled
              reason: 管理员可以修改并直接记录比分
            confirm-score:
              state: enabled
              label: 确认并记录比分
            toggle-left-team-pause:
              state: disabled
              reason: 比分已经提交
            toggle-right-team-pause:
              state: disabled
              reason: 比分已经提交
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []
    notes:
      - 比分提案属于 runtime；最终确认后才写入 status

  - id: SCORE_RIGHT_REJECTED
    title: 队伍2拒绝比分，等待管理员裁定
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#比分设置与暂停
      - frontend/src/main.ts:7247
    given:
      fixture: score-entry
      config:
        scoreReportMode: team_submit_opponent_confirm
      runtime:
        scoreProposal:
          submittedBy: left
          score:
            left: 2
            right: 1
          rejectedBy: right
    expect:
      baseboard: running-current-map-selected
      persistentIndicators:
        - 队伍2未确认比分，等待管理员修改或确认
      views:
        team_left:
          foreground: score-selector
          mode: readonly
          headline: 等待管理员裁定
          controls:
            edit-score:
              state: disabled
            confirm-score:
              state: disabled
              label: 等待管理员裁定
        team_right:
          foreground: score-selector
          mode: readonly
          headline: 等待管理员裁定
          controls:
            edit-score:
              state: disabled
            confirm-score:
              state: disabled
              label: 等待管理员裁定
            reject-score:
              state: hidden
        admin:
          foreground: score-selector
          mode: acting-for-team
          actingAs: both
          headline: 队伍2未确认比分
          controls:
            edit-score:
              state: enabled
            confirm-score:
              state: enabled
              label: 确认并记录比分
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []
    notes:
      - 管理员完成裁定后由服务器发送一次 ADMIN_DECISION_RESOLVED，比赛立即按裁定后的权威状态继续

  - id: SCORE_LEFT_TEAM_PAUSED
    title: 队伍1在比分提交前暂停本队
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#比分设置与暂停
      - frontend/src/main.ts:4036
    given:
      fixture: score-entry
      runtime:
        pause:
          scoreTeams:
            left:
              active: true
              phaseTotalMs: 12000
              matchTotalMs: 45000
              count: 2
            right:
              active: false
              phaseTotalMs: 0
              matchTotalMs: 10000
              count: 1
    expect:
      baseboard: running-current-map-selected
      persistentIndicators:
        - 队伍1暂停中
        - 比分确认倒计时冻结
      views:
        team_left:
          foreground: score-selector
          mode: interactive
          actingAs: left
          visibleData:
            - 本次暂停时长
            - 本小局累计暂停
            - 本小局暂停次数
          controls:
            toggle-own-team-pause:
              state: enabled
              label: 恢复队伍1
        team_right:
          foreground: score-selector
          mode: interactive
          actingAs: right
          visibleData:
            - 队伍1暂停状态
          controls:
            toggle-own-team-pause:
              state: enabled
              label: 暂停队伍2
        admin:
          foreground: score-selector
          mode: acting-for-team
          actingAs: both
          visibleData:
            - 双方暂停次数和累计时间
          controls:
            toggle-left-team-pause:
              state: enabled
              label: 恢复队伍1
            toggle-right-team-pause:
              state: enabled
              label: 暂停队伍2
            global-pause:
              state: enabled
              label: 全局暂停
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          visibleData:
            - 当前底板
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []

  - id: SCORE_CONFIRMED_MAP_WIN
    title: 比分确认后记录本图胜方
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#比分设置与暂停
      - frontend/src/main.ts:1049
    given:
      fixture: score-entry
      runtime:
        scoreProposal:
          submittedBy: left
          score:
            left: 2
            right: 1
          rejectedBy: null
    when:
      actor: team_right
      action: score_confirm
      payload: {}
    expect:
      baseboard: running-map-completed
      views:
        team_left:
          foreground: rest-panel
          mode: interactive
          headline: MAP 1 已结束
          controls:
            skip-rest:
              state: enabled
        team_right:
          foreground: rest-panel
          mode: interactive
          headline: MAP 1 已结束
          controls:
            skip-rest:
              state: enabled
        admin:
          foreground: rest-panel
          mode: interactive
          headline: MAP 1 已结束
          controls:
            skip-rest:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left:
          - MAP_WON
        team_right:
          - MAP_WON
        admin:
          - MAP_WON
        broadcast:
          - MAP_WON
      transition:
        nextPhase: post_map_rest
        statusChanges:
          - match.maps[0].score
          - match.maps[0].winnerSide
          - match.teams.left.seriesScore

  - id: SCORE_CONFIRMED_DRAW
    title: 平局不增加系列赛胜图
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#比分设置与暂停
    given:
      fixture: score-entry
      runtime:
        scoreProposal:
          submittedBy: left
          score:
            left: 1
            right: 1
          rejectedBy: null
    when:
      actor: team_right
      action: score_confirm
      payload: {}
    expect:
      baseboard: running-map-completed
      views:
        team_left:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        team_right:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        admin:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []
      transition:
        nextPhase: post_map_rest
        seriesScoreChange: none

  - id: POST_MAP_REST
    title: 地图结束后的场间休息
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#时间设置
      - frontend/src/main.ts:3327
    given:
      fixture: post-map-rest
    expect:
      baseboard: running-map-completed
      views:
        team_left:
          foreground: rest-panel
          mode: interactive
          headline: MAP 1 已结束
          visibleData:
            - 场间倒计时
            - 休息结束后自动进入下一轮选图
          controls:
            skip-rest:
              state: enabled
              label: 跳过休息
            minimize-foreground:
              state: enabled
        team_right:
          foreground: rest-panel
          mode: interactive
          headline: MAP 1 已结束
          controls:
            skip-rest:
              state: enabled
              label: 跳过休息
            minimize-foreground:
              state: enabled
        admin:
          foreground: rest-panel
          mode: interactive
          headline: MAP 1 已结束
          controls:
            skip-rest:
              state: enabled
              reason: 管理员立即结束休息
            minimize-foreground:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []
    notes:
      - 队伍一方点击后按钮显示“等待对方跳过”
      - 双方都请求跳过或管理员点击后立即结束休息

  - id: MATCH_COMPLETED
    title: 系列赛达到获胜条件
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#比赛结束
      - frontend/src/main.ts:1049
    given:
      fixture: completed-match
      status:
        match:
          winnerSide: left
          teams:
            left:
              seriesScore: 2
            right:
              seriesScore: 0
    expect:
      baseboard: completed
      persistentIndicators:
        - 比赛底板中部显示“比赛已结束”
      views:
        team_left:
          foreground: none
          mode: readonly
          visibleData:
            - 比赛底板中部“比赛已结束”
            - 底板保留最终系列赛比分和已完成地图结果
          controls: {}
        team_right:
          foreground: none
          mode: readonly
          visibleData:
            - 比赛底板中部“比赛已结束”
            - 底板保留最终系列赛比分和已完成地图结果
          controls: {}
        admin:
          foreground: none
          mode: readonly
          visibleData:
            - 比赛底板中部“比赛已结束”
            - 房间管理员阶段回退入口
          controls:
            open-stage-rollback:
              state: enabled
        broadcast:
          foreground: none
          mode: readonly
          visibleData:
            - 比赛底板中部“比赛已结束”
            - 底板保留最终系列赛比分和已完成地图结果
          controls: {}
      notifications:
        team_left:
          - MAP_WON
          - MATCH_WON
        team_right:
          - MAP_WON
          - MATCH_WON
        admin:
          - MAP_WON
          - MATCH_WON
        broadcast:
          - MAP_WON
          - MATCH_WON
      transition:
        nextPhase: completed
        noFurtherMapFlow: true
