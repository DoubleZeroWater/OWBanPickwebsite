schemaVersion: 1
kind: ui-spec-manifest
title: OW Ban Pick 前端行为规范
language: zh-CN
status: confirmed-product-specification
description: >
  本目录把已确认的产品规则结构化为可生成可视化页面、测试用例和评审清单的 YAML。
  它描述前端应有的行为，不替代后端 status 协议；当前实现与本目录不一致时，
  应调整实现以满足本规范。

sourceOfTruth:
  stateProtocol:
    - ../status.yaml
    - ../authoritative-status-schema.md
    - ../../frontend/src/state/protocol.ts
  currentProductRules:
    - ../FUNCTIONS_AND_SETTINGS.md
  currentRendering:
    - ../../frontend/src/main.ts
  precedence:
    - 后端 status、runtime 与权限校验决定动作是否合法
    - 本目录决定各入口应如何呈现合法状态与动作结果
    - 已确认的本目录规则优先于当前前端表现

documents:
  ontology: ontology.yaml
  scenarioSchema: scenario-schema.yaml
  fixtures: fixtures.yaml
  baseboards: baseboards.yaml
  notifications: notifications.yaml
  globalAdmin: global-admin.yaml
  scenarios:
    - scenarios/preparation.yaml
    - scenarios/random-map-side.yaml
    - scenarios/lineup-ban.yaml
    - scenarios/score-rest-completion.yaml
    - scenarios/interrupts-sync.yaml

portals:
  team_left:
    code: A
    label: 队伍1入口
    side: left
  team_right:
    code: B
    label: 队伍2入口
    side: right
  admin:
    code: C
    label: 管理员入口
    side: null
  broadcast:
    code: D
    label: 直播入口
    side: null

reviewStatuses:
  confirmed: 产品规则已经确认；当前实现如不一致，应以该规则为目标修改
  current-only: 当前实现存在，但尚未在产品规则中明确确认
  needs-review: 文档与实现不一致，或产品表现仍需确认
  proposed: 为补足规范而提出，尚未实现

globalInvariants:
  - id: FOUR_PORTALS_EXPLICIT
    rule: 每个场景必须显式填写 team_left、team_right、admin、broadcast 四个视图
  - id: VISIBILITY_AND_PERMISSION_SEPARATE
    rule: foreground 是否可见与 controls 是否可操作必须分别描述
  - id: BROADCAST_READ_ONLY
    rule: 直播入口显示当前比赛阶段的只读镜像，不能出现任何修改比赛状态的可用控件
  - id: ADMIN_DELEGATION_EXPLICIT
    rule: 管理员代操作时必须在 actingAs 中明确当前代表哪一方
  - id: ONE_PRIMARY_FOREGROUND
    rule: 同一入口同一时刻最多显示一个 primary foreground
  - id: CONFIRMATION_BLOCKS_PRIMARY
    rule: selection-confirmation 出现时位于 primary foreground 之上并阻止其操作
  - id: PERSISTENT_STATE_NOT_TOAST_ONLY
    rule: 暂停和待管理员裁定不能只通过会消失的通知表达；待裁定时确认按钮禁用并显示“等待管理员裁定”
  - id: LOCAL_DRAFT_PRESERVED
    rule: 同步对方 runtime 时不得覆盖本入口尚可编辑的阵容或比分草稿
  - id: STALE_ACTION_RESYNC
    rule: 操作遇到 stale_status 时应用服务器完整状态并切换到最新阶段
  - id: NOTIFICATION_SHARED_EVENT
    rule: 成功的比赛操作由服务器生成带 actor 的权威通知事件并由所有入口接收；本地请求错误仅由发起入口接收
  - id: GLOBAL_PAUSE_LOCKS_ALL_ACTIONS
    rule: 全局暂停期间除恢复全局暂停外，任何入口都不能操作比赛按钮
  - id: GLOBAL_PAUSE_FREEZES_TEAM_PAUSE
    rule: 全局暂停可以覆盖正在进行的队伍暂停；全局暂停期间队伍暂停不累计时间，且不能开始或结束队伍暂停
  - id: HEARTBEAT_RESTORES_AUTHORITY
    rule: 请求失败后不增加处理中状态；下一次 heartbeat 使用服务器完整状态覆盖本地临时状态
  - id: MATCH_CANCELLATION_UNSUPPORTED
    rule: 产品不提供取消比赛动作、接口、cancelled 生命周期、cancelled 阶段或取消结果页面
  - id: ROOM_FEEDBACK_POLICY
    rule: 除全局管理员修改配置外不使用浏览器原生 alert 或 confirm；普通结果使用右上角统一通知，需要确认的操作使用站内确认窗口
  - id: COMPLETED_BASEBOARD_ONLY
    rule: 比赛结束后不显示终态前景页面，仅在比赛底板中部显示“比赛已结束”

crossCuttingDecisions:
  - id: BROADCAST_PRIMARY_FOREGROUND
    reviewStatus: confirmed
    affectedPhases:
      - pre_start_rest
      - interactive_random
      - map_pick
      - side_pick
      - lineup_pick
      - ban_order
      - ban_first
      - ban_second
      - score_entry
      - post_map_rest
    decision: 直播入口显示当前阶段的只读前景、倒计时和已确认结果；隐藏所有输入和操作控件
  - id: ADMIN_DECISION_PERSISTENT_COPY
    reviewStatus: confirmed
    decision: 超时交由管理员后，当前确认按钮禁用并显示“等待管理员裁定”，同时发送一次右上角通知
  - id: BAN_ORDER_CONFIRMATION
    reviewStatus: confirmed
    decision: 先选择“先手”或“后手”，再点击下方提交按钮；提交按钮是唯一一次确认，不打开额外确认窗口
  - id: GLOBAL_PAUSE_INTERACTION_LOCK
    reviewStatus: confirmed
    decision: 全局暂停冻结全部计时和比赛操作，只允许管理员恢复全局暂停

renderOrder:
  - match-baseboard
  - primary-foreground
  - minimized-foreground
  - global-pause
  - selection-confirmation
  - notification-stack
