schemaVersion: 1
kind: ui-scenarios
domain: preparation

scenarios:
  - id: CONFIGURING_ROOM
    title: 管理员配置房间，队伍等待配置确认
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#配置生命周期
      - frontend/src/main.ts:2397
    given:
      fixture: configuring-room
    expect:
      baseboard: preparing-draft
      views:
        team_left:
          foreground: team-preparation
          mode: readonly
          headline: 管理员尚未确认配置
          visibleData:
            - 配置确认后即可准备
          controls:
            edit-own-team-name:
              state: disabled
              reason: 配置尚未确认
            ready:
              state: hidden
        team_right:
          foreground: team-preparation
          mode: readonly
          headline: 管理员尚未确认配置
          visibleData:
            - 配置确认后即可准备
          controls:
            edit-own-team-name:
              state: disabled
              reason: 配置尚未确认
            ready:
              state: hidden
        admin:
          foreground: configuration-gate
          mode: interactive
          headline: 待配置阶段
          visibleData:
            - 房间配置编辑器
            - 模板选择与 JSON 导入
          controls:
            edit-config:
              state: enabled
            confirm-config:
              state: enabled
            start-match:
              state: hidden
            force-start-match:
              state: hidden
        broadcast:
          foreground: waiting-start
          mode: readonly
          headline: 直播等待开始
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []

  - id: WAITING_READY_NONE_READY
    title: 配置已确认，双方均未准备
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#开始方式
      - frontend/src/main.ts:2397
    given:
      fixture: waiting-ready
      runtime:
        presence:
          A:
            ready: false
          B:
            ready: false
    expect:
      baseboard: preparing-ready
      views:
        team_left:
          foreground: team-preparation
          mode: interactive
          headline: 等待双方准备
          visibleData:
            - 本队队伍名称
            - 本队准备状态
          controls:
            edit-own-team-name:
              state: enabled
              reason: teamsCanEditOwnName 为 true 且尚未准备
            ready:
              state: enabled
              label: 是
        team_right:
          foreground: team-preparation
          mode: interactive
          headline: 等待双方准备
          visibleData:
            - 本队队伍名称
            - 本队准备状态
          controls:
            edit-own-team-name:
              state: enabled
              reason: teamsCanEditOwnName 为 true 且尚未准备
            ready:
              state: enabled
              label: 是
        admin:
          foreground: configuration-gate
          mode: interactive
          headline: 等待双方准备
          visibleData:
            - 两队连接和准备状态
            - 已确认配置，只供查看
          controls:
            edit-config:
              state: disabled
              reason: 配置已经确认
            start-match:
              state: disabled
              reason: 尚未双方准备
            force-start-match:
              state: enabled
        broadcast:
          foreground: waiting-start
          mode: readonly
          headline: 直播等待开始
          visibleData:
            - 双方准备状态
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []

  - id: WAITING_READY_ONE_READY
    title: 队伍1已准备，等待队伍2
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#开始方式
      - frontend/src/main.ts:2421
    given:
      fixture: waiting-ready
      runtime:
        presence:
          A:
            ready: true
            nameConfirmed: true
          B:
            ready: false
    expect:
      baseboard: preparing-ready
      views:
        team_left:
          foreground: team-preparation
          mode: readonly
          headline: 等待双方准备
          visibleData:
            - 已准备
          controls:
            edit-own-team-name:
              state: disabled
              reason: 准备一旦确认不能撤销或改名
            ready:
              state: disabled
              label: 已准备
        team_right:
          foreground: team-preparation
          mode: interactive
          headline: 等待双方准备
          controls:
            edit-own-team-name:
              state: enabled
            ready:
              state: enabled
              label: 是
        admin:
          foreground: configuration-gate
          mode: interactive
          headline: 等待队伍2准备
          controls:
            start-match:
              state: disabled
              reason: 队伍2尚未准备
            force-start-match:
              state: enabled
        broadcast:
          foreground: waiting-start
          mode: readonly
          headline: 直播等待开始
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []

  - id: WAITING_READY_BOTH_MANUAL_START
    title: 双方已准备，等待管理员开始
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#开始方式
    given:
      fixture: waiting-ready
      runtime:
        presence:
          A:
            ready: true
            nameConfirmed: true
          B:
            ready: true
            nameConfirmed: true
      config:
        startWithDefaultConfig: false
    expect:
      baseboard: preparing-ready
      views:
        team_left:
          foreground: team-preparation
          mode: readonly
          headline: 双方已准备
          controls:
            ready:
              state: disabled
              label: 已准备
        team_right:
          foreground: team-preparation
          mode: readonly
          headline: 双方已准备
          controls:
            ready:
              state: disabled
              label: 已准备
        admin:
          foreground: configuration-gate
          mode: interactive
          headline: 双方已准备
          controls:
            start-match:
              state: enabled
            force-start-match:
              state: enabled
        broadcast:
          foreground: waiting-start
          mode: readonly
          headline: 直播等待开始
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []

  - id: MATCH_START_MANUAL
    title: 管理员正常开始比赛
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#开始方式
      - frontend/src/main.ts:878
    given:
      fixture: waiting-ready
      runtime:
        presence:
          A:
            ready: true
          B:
            ready: true
    when:
      actor: admin
      action: match_start
      payload:
        force: false
    expect:
      baseboard: running-current-map-pending
      views:
        team_left:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        team_right:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        admin:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left:
          - MATCH_STARTED_MANUAL
        team_right:
          - MATCH_STARTED_MANUAL
        admin:
          - MATCH_STARTED_MANUAL
        broadcast:
          - MATCH_STARTED_MANUAL
      transition:
        nextPhase: pre_start_rest
        alternativeWhenPreStartRestSecondsIsZero: map_pick-or-automatic-skip

  - id: MATCH_START_FORCE
    title: 管理员在队伍未全部准备时强制开始
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#开始方式
      - frontend/src/main.ts:878
    given:
      fixture: waiting-ready
      runtime:
        presence:
          A:
            ready: true
          B:
            ready: false
    when:
      actor: admin
      action: match_start
      payload:
        force: true
    expect:
      baseboard: running-current-map-pending
      views:
        team_left:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        team_right:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        admin:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left:
          - MATCH_STARTED_FORCE
        team_right:
          - MATCH_STARTED_FORCE
        admin:
          - MATCH_STARTED_FORCE
        broadcast:
          - MATCH_STARTED_FORCE
      transition:
        nextPhase: pre_start_rest

  - id: MATCH_START_AUTO
    title: 双方准备后自动开始比赛
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#开始方式
    given:
      fixture: waiting-ready
      config:
        startWithDefaultConfig: true
      runtime:
        presence:
          A:
            ready: true
          B:
            ready: true
    when:
      actor: server
      action: auto_start_when_both_ready
    expect:
      baseboard: running-current-map-pending
      views:
        team_left:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        team_right:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        admin:
          foreground: rest-panel
          mode: interactive
          controls:
            skip-rest:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left:
          - MATCH_STARTED_AUTO
        team_right:
          - MATCH_STARTED_AUTO
        admin:
          - MATCH_STARTED_AUTO
        broadcast:
          - MATCH_STARTED_AUTO
      transition:
        nextPhase: pre_start_rest

  - id: PRE_START_REST
    title: 比赛开始后的赛前准备倒计时
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#时间设置
      - frontend/src/main.ts:3327
    given:
      fixture: pre-start-rest
    expect:
      baseboard: running-current-map-pending
      views:
        team_left:
          foreground: rest-panel
          mode: interactive
          headline: MAP 1 准备时间
          visibleData:
            - 准备倒计时
            - 准备结束后开始首张地图
          controls:
            skip-rest:
              state: enabled
              label: 跳过休息
            minimize-foreground:
              state: enabled
        team_right:
          foreground: rest-panel
          mode: interactive
          headline: MAP 1 准备时间
          visibleData:
            - 准备倒计时
          controls:
            skip-rest:
              state: enabled
              label: 跳过休息
            minimize-foreground:
              state: enabled
        admin:
          foreground: rest-panel
          mode: interactive
          headline: MAP 1 准备时间
          controls:
            skip-rest:
              state: enabled
              reason: 管理员立即结束准备时间
            minimize-foreground:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          hiddenData:
            - 休息前景层
            - 准备倒计时
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []
    notes:
      - 队伍分别请求跳过，双方都请求后才结束；管理员可直接结束
      - 当前直播入口隐藏休息前景层，此行为需在后续可视化评审中确认是否满足直播需求
