schemaVersion: 1
kind: ui-scenarios
domain: interrupts-sync

scenarios:
  - id: GLOBAL_PAUSE_ACTIVE_DURING_MAP_PICK
    title: 管理员在选图阶段开启全局暂停
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#时间设置
      - frontend/src/main.ts:3366
      - backend/room_engine.py:797
    given:
      fixture: map-pick-left
      runtime:
        pause:
          global:
            active: true
            totalMs: 45000
    expect:
      baseboard: running-current-map-pending
      persistentIndicators:
        - 管理员已暂停
        - 本次与全局累计暂停时间
        - 当前倒计时冻结
      views:
        team_left:
          foreground: map-selector
          overlays:
            - global-pause
          mode: readonly
          actingAs: left
          controls:
            select-map:
              state: disabled
              reason: 全局暂停期间不能操作比赛
            global-resume:
              state: hidden
        team_right:
          foreground: map-selector
          overlays:
            - global-pause
          mode: readonly
          controls:
            select-map:
              state: disabled
              reason: 全局暂停期间不能操作比赛
            global-resume:
              state: hidden
        admin:
          foreground: map-selector
          overlays:
            - global-pause
          mode: readonly
          actingAs: left
          controls:
            select-map:
              state: disabled
              reason: 全局暂停期间不能操作比赛
            global-resume:
              state: enabled
              label: 恢复全局暂停
        broadcast:
          foreground: phase-readonly-mirror
          overlays:
            - global-pause
          mode: readonly
          controls:
            global-resume:
              state: hidden
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []
    notes:
      - 全局暂停冻结当前阶段倒计时和全部比赛操作
      - 全局暂停期间唯一可用的比赛按钮是管理员的“恢复全局暂停”

  - id: GLOBAL_PAUSE_OVER_ACTIVE_TEAM_PAUSE
    title: 全局暂停覆盖正在进行的队伍比分暂停
    reviewStatus: confirmed
    sources:
      - product-decision-2026-07-24
    given:
      fixture: score-entry
      runtime:
        pause:
          global:
            active: true
            totalMs: 45000
          scoreTeams:
            left:
              active: true
              phaseTotalMs: 12000
              matchTotalMs: 45000
              count: 2
            right:
              active: false
              phaseTotalMs: 0
              matchTotalMs: 10000
              count: 1
    expect:
      baseboard: running-current-map-selected
      persistentIndicators:
        - 全局暂停中
        - 队伍1暂停保持激活但暂停时长停止累计
        - 比分确认倒计时冻结
      views:
        team_left:
          foreground: score-selector
          overlays:
            - global-pause
          mode: readonly
          controls:
            toggle-own-team-pause:
              state: disabled
              reason: 必须先恢复全局暂停
        team_right:
          foreground: score-selector
          overlays:
            - global-pause
          mode: readonly
          controls:
            toggle-own-team-pause:
              state: disabled
              reason: 必须先恢复全局暂停
        admin:
          foreground: score-selector
          overlays:
            - global-pause
          mode: readonly
          controls:
            toggle-left-team-pause:
              state: disabled
              reason: 必须先恢复全局暂停
            toggle-right-team-pause:
              state: disabled
              reason: 必须先恢复全局暂停
            global-resume:
              state: enabled
              label: 恢复全局暂停
        broadcast:
          foreground: phase-readonly-mirror
          overlays:
            - global-pause
          mode: readonly
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []
      timing:
        globalPauseAccumulates: true
        activeTeamPauseAccumulates: false
        phaseCountdownAccumulates: false
    notes:
      - 全局暂停可以在任一队伍暂停期间启动
      - 恢复全局暂停后，原本激活的队伍暂停继续累计，直到有权限的入口结束该队伍暂停

  - id: PRIMARY_FOREGROUND_MINIMIZED
    title: 用户返回比赛底板并最小化当前操作层
    reviewStatus: confirmed
    sources:
      - frontend/src/main.ts:3386
      - frontend/src/main.ts:4820
    given:
      fixture: map-pick-left
      localUI:
        foregroundMinimized: true
    expect:
      baseboard: running-current-map-pending
      views:
        team_left:
          foreground: minimized-current-operation
          mode: interactive
          headline: MAP 1 队伍1选图中
          visibleData:
            - 阶段名称
            - 剩余时间
          controls:
            restore-foreground:
              state: enabled
        team_right:
          foreground: map-selector
          mode: readonly
          headline: 等待队伍1选择
          controls:
            minimize-foreground:
              state: enabled
        admin:
          foreground: map-selector
          mode: acting-for-team
          actingAs: left
          controls:
            minimize-foreground:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []
    notes:
      - 最小化属于单个浏览器 localUI，不同步到其他入口
      - 最小化条只显示阶段名称、剩余时间和恢复按钮，不显示弹窗
      - 最小化不会暂停、延长或重置任何计时

  - id: PORTAL_DISCONNECTED_PRESENCE
    title: 队伍2连接超时后显示断开
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#房间入口与权限
      - frontend/src/main.ts:2497
    given:
      fixture: map-pick-left
      runtime:
        presence:
          A:
            connected: true
          B:
            connected: false
          C:
            connected: true
    expect:
      baseboard: running-current-map-pending
      persistentIndicators:
        - 连接状态条中队伍2为红色已断开
      views:
        team_left:
          foreground: map-selector
          mode: interactive
          actingAs: left
          visibleData:
            - 队伍2已断开
          controls:
            select-map:
              state: enabled
        team_right:
          foreground: map-selector
          mode: readonly
          visibleData:
            - 本入口重连后恢复为已连接
          controls:
            select-map:
              state: disabled
              reason: 当前操作权属于队伍1
        admin:
          foreground: map-selector
          mode: acting-for-team
          actingAs: left
          visibleData:
            - 队伍2已断开
          controls:
            select-map:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          visibleData:
            - 队伍2已断开
          controls: {}
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast: []
    notes:
      - 断线只改变 presence，不自动改变比赛阶段或操作权
      - 当前实现没有单独的断线 toast

  - id: STALE_ACTION_RESYNCED
    title: 旧页面提交动作时同步到服务器最新阶段
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#多端同步规则
      - frontend/src/main.ts:4406
      - backend/room_engine.py:178
    given:
      fixture: map-pick-left
      localUI:
        selectedMapId: lijang-tower
        selectionConfirmation: map
    when:
      actor: team_left
      action: map_select_with_stale_status_ref
      payload:
        mapId: lijang-tower
    expect:
      baseboard: running-current-map-selected
      views:
        team_left:
          foreground: side-selector
          mode: readonly
          headline: 已切换到服务器当前阶段
          controls:
            select-side:
              state: disabled
              reason: 示例中最新阶段的选择权属于队伍2
        team_right:
          foreground: side-selector
          mode: interactive
          actingAs: right
          controls:
            select-side:
              state: enabled
        admin:
          foreground: side-selector
          mode: acting-for-team
          actingAs: right
          controls:
            select-side:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left:
          - STALE_STATUS
        team_right: []
        admin: []
        broadcast: []
      transition:
        actionResult: rejected-stale-status
        clientBehavior:
          - 应用响应中的完整 status 与 runtime
          - 丢弃旧 selection-confirmation
          - 重绘为最新 phase

  - id: FORBIDDEN_ACTION_LOCAL_ERROR
    title: 无权限入口尝试提交当前阶段动作
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#房间入口与权限
      - backend/room_engine.py:257
    given:
      fixture: map-pick-left
    when:
      actor: team_right
      action: map_select
      payload:
        mapId: lijang-tower
    expect:
      baseboard: running-current-map-pending
      views:
        team_left:
          foreground: map-selector
          mode: interactive
          actingAs: left
          controls:
            select-map:
              state: enabled
        team_right:
          foreground: map-selector
          mode: readonly
          headline: 等待队伍1选择
          controls:
            select-map:
              state: disabled
              reason: 当前入口没有本阶段操作权
        admin:
          foreground: map-selector
          mode: acting-for-team
          actingAs: left
          controls:
            select-map:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left: []
        team_right:
          - FORBIDDEN_ACTION
        admin: []
        broadcast: []
      transition:
        actionResult: rejected-forbidden
        phaseUnchanged: true

  - id: BROADCAST_ACTION_FORBIDDEN
    title: 直播入口始终只读
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#房间入口与权限
      - backend/room_engine.py:171
    given:
      fixture: score-entry
    when:
      actor: broadcast
      action: score_submit
      payload:
        score:
          left: 2
          right: 1
    expect:
      baseboard: running-current-map-selected
      views:
        team_left:
          foreground: score-selector
          mode: interactive
          controls:
            edit-score:
              state: enabled
        team_right:
          foreground: score-selector
          mode: interactive
          controls:
            edit-score:
              state: enabled
        admin:
          foreground: score-selector
          mode: acting-for-team
          actingAs: both
          controls:
            edit-score:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls:
            edit-score:
              state: hidden
            submit-score:
              state: hidden
      notifications:
        team_left: []
        team_right: []
        admin: []
        broadcast:
          - FORBIDDEN_ACTION
      transition:
        actionResult: rejected-forbidden
        phaseUnchanged: true

  - id: ADMIN_ROLLBACK_STAGE
    title: 房间管理员按可读比赛阶段回退
    reviewStatus: confirmed
    sources:
      - product-decision-2026-07-24
    given:
      fixture: score-entry
    when:
      actor: admin
      action: confirm_stage_rollback
      payload:
        stageId: map-1-map-pick
        stageLabel: 第1张地图 · 选图
    expect:
      baseboard: running-current-map-pending
      persistentIndicators:
        - 当前状态使用新的 epoch、revision 和 phaseId
      rollbackPanel:
        owner: room-admin
        globalAdminVisible: false
        internalRevisionVisible: false
        abstractPhaseNameVisible: false
        optionLabelTemplate: 第{mapNumber}张地图 · {businessStageLabel}
        stageTemplateRule: 每张地图都按相同顺序显示以下四个业务阶段；不适用或不可回退的阶段保留显示但禁用
        businessStagesPerMap:
          - id: map-pick
            label: 选图
            visibleWhen: always
            disabledWhen: 该地图为无需选图的固定地图，或该次选图按规则不可回退
            disabledReasonRequired: true
          - id: lineup-pick
            label: 确认上人
            visibleWhen: always
            disabledWhen: 房间未启用上人，或该地图尚未到达此阶段
          - id: ban-confirm
            label: 确认 Ban
            visibleWhen: always
            disabledWhen: 房间未启用 Ban，或该地图尚未到达此阶段
          - id: score-entry
            label: 录入比赛得分
            visibleWhen: always
            disabledWhen: 该地图尚未到达比分阶段
        confirmation:
          count: 1
          behavior: 选择阶段后点击“确认回退”立即提交，不再打开第二个确认窗口
      views:
        team_left:
          foreground: map-selector
          mode: interactive
          actingAs: left
          headline: 比赛已回退到第1张地图 · 选图
          controls:
            select-map:
              state: enabled
        team_right:
          foreground: map-selector
          mode: readonly
          headline: 比赛已回退到第1张地图 · 选图
          controls:
            select-map:
              state: disabled
              reason: 示例中操作权属于队伍1
        admin:
          foreground: map-selector
          mode: acting-for-team
          actingAs: left
          headline: 比赛已回退到第1张地图 · 选图
          controls:
            select-map:
              state: enabled
            open-stage-rollback:
              state: enabled
            select-rollback-stage:
              state: enabled
            confirm-stage-rollback:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          visibleData:
            - 回退后的比赛底板
          controls: {}
      notifications:
        team_left:
          - STAGE_RESTORED
        team_right:
          - STAGE_RESTORED
        admin:
          - STAGE_RESTORED
        broadcast:
          - STAGE_RESTORED
      transition:
        frontendMapsBusinessStageToInternalRevision: true
        internalRevisionNotExposedToUI: true
        currentRevision: old-current-plus-one
        epoch: old-epoch-plus-one
        runtimeReset: true

  - id: ADMIN_ROLLBACK_TO_CONFIG
    title: 管理员回退到赛前配置
    reviewStatus: confirmed
    sources:
      - docs/FUNCTIONS_AND_SETTINGS.md#配置生命周期
    given:
      fixture: score-entry
    when:
      actor: admin
      action: rollback_to_config
    expect:
      baseboard: preparing-draft
      persistentIndicators:
        - 地图、阵容、禁用、比分和比赛进度已清空
        - 双方准备状态已重置
      views:
        team_left:
          foreground: team-preparation
          mode: readonly
          headline: 管理员尚未确认配置
          controls:
            ready:
              state: hidden
        team_right:
          foreground: team-preparation
          mode: readonly
          headline: 管理员尚未确认配置
          controls:
            ready:
              state: hidden
        admin:
          foreground: configuration-gate
          mode: interactive
          headline: 待配置阶段
          controls:
            edit-config:
              state: enabled
            confirm-config:
              state: enabled
        broadcast:
          foreground: waiting-start
          mode: readonly
          headline: 直播等待开始
          controls: {}
      notifications:
        team_left:
          - STAGE_RESTORED
        team_right:
          - STAGE_RESTORED
        admin:
          - STAGE_RESTORED
        broadcast:
          - STAGE_RESTORED
      transition:
        nextPhase: configuring
        destructiveConfirmationRequired: true

  - id: ACTION_NETWORK_ERROR
    title: 当前入口提交动作失败并在下一次 heartbeat 恢复权威状态
    reviewStatus: confirmed
    sources:
      - frontend/src/main.ts:4406
    given:
      fixture: map-pick-left
      localUI:
        selectedMapId: lijang-tower
    when:
      actor: team_left
      action: map_select_network_failure
      payload:
        mapId: lijang-tower
    expect:
      baseboard: running-current-map-pending
      pendingState:
        visible: false
      resynchronization:
        trigger: next-heartbeat
        source: server-full-status-and-runtime
        behavior: 覆盖本地可能存在的乐观状态，恢复服务器在失败操作前的权威阶段
      views:
        team_left:
          foreground: map-selector
          mode: interactive
          actingAs: left
          headline: heartbeat 后恢复服务器当前阶段
          controls:
            select-map:
              state: enabled
            confirm-map:
              state: enabled
        team_right:
          foreground: map-selector
          mode: readonly
          controls:
            select-map:
              state: disabled
              reason: 当前操作权属于队伍1
        admin:
          foreground: map-selector
          mode: acting-for-team
          actingAs: left
          controls:
            select-map:
              state: enabled
        broadcast:
          foreground: phase-readonly-mirror
          mode: readonly
          controls: {}
      notifications:
        team_left:
          - NETWORK_OR_ACTION_ERROR
        team_right: []
        admin: []
        broadcast: []
      transition:
        actionResult: not-authoritatively-accepted
        immediateLocalState: 允许短暂保持当前实现的本地状态
        nextHeartbeatAppliesServerState: true
        processingIndicator: none
