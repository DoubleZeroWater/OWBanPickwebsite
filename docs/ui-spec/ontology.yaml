schemaVersion: 1
kind: ui-ontology

phaseTypes:
  - configuring
  - waiting_ready
  - pre_start_rest
  - interactive_random
  - map_pick
  - side_pick
  - lineup_pick
  - ban_order
  - ban_first
  - ban_second
  - score_entry
  - post_map_rest
  - completed

viewerModes:
  interactive: 可以修改当前阶段状态
  acting-for-team: 管理员代表 actingAs 指定队伍操作
  readonly: 可查看但不能修改
  hidden: 不显示该前景层

layers:
  match-baseboard:
    persistence: persistent
    purpose: 展示已经成为比赛事实的内容
  primary-foreground:
    persistence: phase
    purpose: 展示当前阶段需要关注或完成的任务
  minimized-foreground:
    persistence: local
    purpose: 用户返回比赛底板后保留阶段名称、剩余时间和恢复按钮；最小化不暂停任何计时
  global-pause:
    persistence: runtime
    purpose: 展示全局暂停及累计时间
  selection-confirmation:
    persistence: local
    purpose: 展示地图、阵容或英雄的二次确认；禁用顺序不使用该图层
  notification-stack:
    persistence: transient
    purpose: 以统一无色调样式展示“谁做了什么”的短暂消息

foregrounds:
  none:
    layer: primary-foreground
  configuration-gate:
    layer: primary-foreground
  team-preparation:
    layer: primary-foreground
  waiting-start:
    layer: primary-foreground
  rest-panel:
    layer: primary-foreground
  interactive-random:
    layer: primary-foreground
  map-selector:
    layer: primary-foreground
  side-selector:
    layer: primary-foreground
  lineup-selector:
    layer: primary-foreground
  ban-order-selector:
    layer: primary-foreground
  hero-ban-selector:
    layer: primary-foreground
  score-selector:
    layer: primary-foreground
  phase-readonly-mirror:
    layer: primary-foreground
    purpose: 直播入口镜像当前阶段页面，只显示共享事实和倒计时，不显示输入或可用控件
  selection-confirmation:
    layer: selection-confirmation
  minimized-current-operation:
    layer: minimized-foreground
  global-pause:
    layer: global-pause

controlStates:
  enabled: 可见且可以操作
  disabled: 可见但不可操作，必须提供禁用原因或等待文案
  hidden: 不显示

commonControls:
  edit-config: 编辑房间配置
  confirm-config: 确认房间配置
  start-match: 正常开始比赛
  force-start-match: 强制开始比赛
  ready: 确认本队准备
  edit-own-team-name: 编辑本队名称
  select-random-bit: 选择并提交 0 或 1
  select-map: 选择合法地图
  confirm-map: 打开地图二次确认
  select-side: 选择攻防或阵营
  confirm-side: 直接确认攻防或阵营
  edit-left-lineup: 编辑队伍1阵容
  edit-right-lineup: 编辑队伍2阵容
  confirm-lineup: 打开阵容二次确认
  select-ban-order: 选择先手或后手
  confirm-ban-order: 提交已选择的先手或后手，不打开额外确认窗口
  select-hero-ban: 选择合法英雄
  confirm-hero-ban: 打开英雄二次确认
  edit-score: 编辑双方比分
  submit-score: 提交比分
  confirm-score: 确认对方比分或管理员记录比分
  reject-score: 申诉错误比分
  toggle-own-team-pause: 暂停或恢复本队比分计时
  toggle-left-team-pause: 管理员暂停或恢复队伍1
  toggle-right-team-pause: 管理员暂停或恢复队伍2
  skip-rest: 请求或强制跳过休息
  minimize-foreground: 返回比赛底板并保留最小化摘要
  restore-foreground: 恢复当前阶段前景层
  global-pause: 暂停全局活动倒计时
  global-resume: 恢复全局活动倒计时
  timeout-extend: 超时后延长倒计时
  timeout-random: 超时后随机合法选择
  timeout-forfeit: 超时后将当前方本图判负
  rollback-config: 回退到赛前配置
  open-stage-rollback: 打开房间管理员的可读阶段回退面板
  select-rollback-stage: 选择“第几张地图 · 业务阶段”，不显示内部 revision 或抽象阶段名
  confirm-stage-rollback: 一次确认并直接回退到所选业务阶段
  cancel-confirmation: 返回修改
  accept-confirmation: 确认当前选择
